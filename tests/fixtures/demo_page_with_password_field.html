<!DOCTYPE html>
<html>
<head><title>Web form demo</title></head>
<body>
  <h1>Web form</h1>
  <p>This demo page showcases various input types. Nothing here is gated
  behind authentication -- it's all directly visible and usable.</p>
  <form>
    <input type="text" name="text-input" aria-label="Text input" />
    <input type="password" name="password-input" aria-label="Password input" />
    <textarea name="textarea" aria-label="Textarea"></textarea>
    <select name="dropdown" aria-label="Dropdown">
      <option>One</option>
      <option>Two</option>
    </select>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
