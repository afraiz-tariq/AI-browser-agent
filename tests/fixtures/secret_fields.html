<!DOCTYPE html>
<html>
<head><title>Secret fields</title></head>
<body>
  <h1>Account settings</h1>
  <form>
    <!-- No aria-label/placeholder: the old label fallback would have used the value itself. -->
    <input type="password" value="hunter2-PASSWORD-SECRET" />
    <input type="text" name="api_token" value="tok-TOKEN-SECRET" />
    <input type="text" autocomplete="cc-number" value="4111-CARD-SECRET" />
    <input type="password" id="new-pass" aria-label="New password" />
    <input type="text" name="nickname" value="plain-visible-value" />
    <input type="submit" value="Delete account" />
    <button type="button">Reset password</button>
  </form>
</body>
</html>
